name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.1'
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -OutputDirectory dist

      - name: Release notes path
        id: notes
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $p = "docs/RELEASE_$v.md"
          if (!(Test-Path $p)) { "Release $v" | Set-Content $p }
          "path=$p" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 青影 ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS-*.txt
