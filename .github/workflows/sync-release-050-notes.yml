name: sync-v0.5.0-notes

# 将 docs/RELEASE_0.5.0.md 同步到已发布的 v0.5.0 Release 正文（修正笔误等）
on:
  push:
    branches: [main]
    paths:
      - 'docs/RELEASE_0.5.0.md'
      - '.github/workflows/sync-release-050-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update v0.5.0 release body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('docs/RELEASE_0.5.0.md', 'utf8');
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v0.5.0',
            });
            if (rel.body === body) {
              core.info('v0.5.0 body already up to date');
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: rel.id,
              body,
            });
            core.info('Updated v0.5.0 release body');